<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMO Keyboard Lighting Playground · 24 live effects</title>
<style>
:root{
  --ink:#1a1a1a; --ink2:#55534e; --ink3:#8a8880;
  --line:#e3e1db; --bg:#fff; --bg2:#faf9f6; --bg3:#f1efea;
  --acc:#1f5f8b; --acc2:#0d3d5c; --bad:#a3342a; --ok:#1c6b4a;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1260px;margin:0 auto;padding:26px 20px 56px}
h1{font-size:19px;font-weight:600;margin:0 0 5px}
.sub{color:var(--ink3);font-size:12.5px;margin-bottom:16px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.head .sub{margin-bottom:0}
.lang{font-family:var(--mono);font-size:11.5px;padding:4px 11px;border-radius:20px;
  border:1px solid var(--line);background:#fff;color:var(--ink2);flex:none;letter-spacing:.02em}
.lang:hover{border-color:var(--acc);color:var(--acc)}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.top .sp{flex:1}
.cols{display:grid;grid-template-columns:308px 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--acc2);
  margin:0 0 10px;text-transform:uppercase}
button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink);transition:.12s}
button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.42;cursor:not-allowed}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover:not(:disabled){background:var(--acc2);color:#fff}
button.on{background:#eaf1f7;border-color:var(--acc);color:var(--acc2)}
.row{display:flex;gap:7px;flex-wrap:wrap}
label.f{display:block;font-size:11.5px;color:var(--ink3);margin:9px 0 3px}
select,input[type=number]{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);
  border-radius:6px;width:100%;background:#fff;color:var(--ink);font-family:var(--mono)}
input[type=range]{width:100%;accent-color:var(--acc)}
.gridfx{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:396px;overflow-y:auto;padding-right:2px;scrollbar-width:thin}
.gridfx button{text-align:left;padding:6px 9px;line-height:1.3;font-size:12px}
.gridfx button b{display:block;font-weight:500;font-size:12px}
.gridfx button i{display:block;font-style:normal;font-size:10.5px;color:var(--ink3);
  font-family:var(--mono);margin-top:1px}
.gridfx button.on i{color:var(--acc)}
#stage{background:#111110;border:1px solid #2a2a26;border-radius:10px;padding:14px;position:relative}
#cv{width:100%;height:auto;display:block}
.bar{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;
  color:#8f8d85;margin-top:10px;padding-top:9px;border-top:1px solid #2a2a26}
.bar b{color:#c8c6bd;font-weight:500}
.status{font-size:12px;padding:7px 10px;border-radius:7px;background:var(--bg3);color:var(--ink2);font-family:var(--mono)}
.hint{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.5}
.pill{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:20px;
  background:var(--bg3);color:var(--ink3);font-family:var(--mono)}
</style>
<div id="errbar" style="display:none;position:fixed;left:0;right:0;top:0;z-index:99;background:#a3342a;color:#fff;font:12px/1.6 Consolas,monospace;padding:9px 14px;white-space:pre-wrap"></div>
<script>
window.onerror=function(m,src,l,c){
  var b=document.getElementById('errbar');
  if(!b) return;
  b.style.display='block';
  b.textContent='脚本错误：'+m+'  行 '+l+':'+c;
};
</script>
<style>
.dl{white-space:pre-wrap;word-break:break-all}
.dl.tx{color:#8fb8e8}
.dl.rx{color:#7ec89a}
.dl.warn{color:#d9b45c}
.dl.er{color:#e08a80}
.dl.ok{color:#6fd3a8;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>PMO Keyboard Lighting Playground</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button id="btnLang" class="lang" title="切换到中文 / Switch to English">EN</button>
  </div>

  <div class="top">
    <button class="primary" id="btnConnect" data-zh="连接键盘" data-en="Connect keyboard">连接键盘</button>
    <button id="btnStop" disabled data-zh="停止并交还固件" data-en="Stop &amp; hand back">停止并交还固件</button>
    <button id="btnBase" disabled data-zh="开启灯光通道" data-en="Enable live channel">开启灯光通道</button>
    <button id="btnMatrix" disabled data-zh="读灯矩阵" data-en="Read LED matrix">读灯矩阵</button>
    <button id="btnSlot" disabled data-zh="写死到自定义一（存静态帧）" data-en="Save to Custom 1 (static frame)"
      data-zh-title="只把当前这一瞬间的静态 RGB 写进板载「自定义一」，动画本身存不进去"
      data-en-title="Writes only the static RGB of this one frame into onboard Custom 1 — the animation itself cannot be stored">写死到自定义一（存静态帧）</button>
    <div class="sp"></div>
    <div style="min-width:210px">
      <select id="selLayout">
        <option value="" data-zh="— 选择机型布局 —" data-en="— Choose layout —">— 选择机型布局 —</option>
      </select>
    </div>
    <div class="status" id="devStatus" data-zh="未连接（预览模式）" data-en="Not connected (preview)">未连接（预览模式）</div>
  </div>

  <div class="cols">
    <div>
      <div class="card">
        <h2 data-zh="效果" data-en="Effects">效果</h2>
        <div class="gridfx" id="fxList"></div>
      </div>

      <div class="card">
        <h2 data-zh="参数" data-en="Parameters">参数</h2>
        <label class="f"><span data-zh="速度" data-en="Speed">速度</span> <span id="vSpeed" class="pill">1.00</span></label>
        <input type="range" id="pSpeed" min="10" max="300" value="100">
        <label class="f"><span data-zh="空间尺度" data-en="Scale">空间尺度</span> <span id="vScale" class="pill">1.00</span></label>
        <input type="range" id="pScale" min="30" max="260" value="100">
        <label class="f"><span data-zh="亮度" data-en="Brightness">亮度</span> <span id="vBright" class="pill">100</span></label>
        <input type="range" id="pBright" min="5" max="100" value="100">
        <label class="f"><span data-zh="推帧频率" data-en="Push rate">推帧频率</span> <span id="vFps" class="pill">25 Hz</span></label>
        <input type="range" id="pFps" min="10" max="60" value="25" step="5">
      </div>
    </div>

    <div>
      <div id="stage">
        <canvas id="cv" width="940" height="340"></canvas>
        <div class="bar">
          <span><span data-zh="帧率" data-en="FPS">帧率</span> <b id="sFps">—</b></span>
          <span><span data-zh="灯数" data-en="LEDs">灯数</span> <b id="sLeds">—</b></span>
          <span><span data-zh="推送" data-en="Push">推送</span> <b id="sPush">—</b></span>
          <span><span data-zh="当前" data-en="Effect">当前</span> <b id="sFx">—</b></span>
          <span><span data-zh="布局" data-en="Layout">布局</span> <b id="sLayout">—</b></span>
        </div>
      </div>
      <div class="card" style="margin-top:12px">
        <h2><span data-zh="诊断日志" data-en="Diagnostics">诊断日志</span> <span class="pill" id="diagCount">0</span>
          <button id="btnDiagClear" style="float:right;font-size:11px;padding:2px 8px" data-zh="清空" data-en="Clear">清空</button>
        </h2>
        <div id="diagLog" style="max-height:260px;overflow:auto;font:11px/1.55 Consolas,monospace;
             background:#15181d;color:#c8cdd6;padding:8px 10px;border-radius:6px"></div>
        <div class="hint" data-zh="tx = 发给键盘，rx = 键盘回包，warn/er = 异常。连不上时先看这里有没有 rx 行。"
             data-en="tx = sent to the keyboard, rx = replies from it, warn/er = problems. If it will not connect, check whether any rx line shows up.">tx = 发给键盘，rx = 键盘回包，warn/er = 异常。连不上时先看这里有没有 rx 行。</div>
      </div>
      <div class="card" style="margin-top:12px"><div class="hint" id="tip"></div></div>
    </div>
  </div>
</div>

function diag(kind, msg, en){
  const box = $('diagLog');
  if (!box) return;
  const t = new Date();
  const ts = String(t.getMinutes()).padStart(2,'0') + ':' + String(t.getSeconds()).padStart(2,'0');
  const line = document.createElement('div');
  line.className = 'dl ' + kind;
  line.textContent = ts + '  ' + ((LANG === 'en' && en) ? en : msg);
  box.appendChild(line);
  S.diagN++;
  while (box.children.length > 300) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
  const c = $('diagCount'); if (c) c.textContent = S.diagN;
}

function hsv(h, s, v){
  h = ((h % 1) + 1) % 1;
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  let r, g, b;
  switch (i % 6){
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    default: r = v; g = p; b = q;
  }
  return [r * 255, g * 255, b * 255];
}

// RGB565 小端编码，与固件 SET_LIGHT_SYNC 的数据格式一致
function rgb565(r, g, b){
  const v = ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
  return [v & 0xFF, (v >> 8) & 0xFF];
}

function fireColor(h){
  h = clamp(h, 0, 1);
  if (h < 0.18) return [h / 0.18 * 120, 0, 0];
  if (h < 0.45) return [120 + (h - 0.18) / 0.27 * 135, (h - 0.18) / 0.27 * 90, 0];
  if (h < 0.75) return [255, 90 + (h - 0.45) / 0.30 * 140, 10];
  return [255, 230 + (h - 0.75) / 0.25 * 25, 120 + (h - 0.75) / 0.25 * 130];
}

function hash2(ix, iy){
  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function smooth01(t){ return t * t * (3 - 2 * t); }
// 二维值噪声（双线性 + smoothstep 插值），够云雾用，比 Perlin 便宜
function noise2(x, y){
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const fx = smooth01(x - x0), fy = smooth01(y - y0);
  const a = hash2(x0, y0), b = hash2(x0 + 1, y0);
  const c = hash2(x0, y0 + 1), d = hash2(x0 + 1, y0 + 1);
  return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
}
// 四倍频叠加，得到有层次的云
function fbm2(x, y){
  let v = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++){ v += amp * noise2(x * f, y * f); f *= 2; amp *= 0.5; }
  return v;
}



// 灯号偏移：实机实测 WAVE75 的灯珠编号整体比厂商 layouts 的 lightIndex 大 1
// （厂商 ↑ 写 71 → 实测 72；L-Ctrl 实测 73）。所以整盘 +1：81 个键落在 1..81，
// 0 号是那颗没有按键的灯 —— 固件上报 82 颗（0..81）正好对上。
// 布局里用 lay.off 声明偏移（现在固定生效，界面上那个校准下拉已按需求移除）。
function buildGrid(key){
  const lay = LAYOUTS[key];
  if (!lay) return null;
  const rows = new Set(), cols = new Set();
  for (const k of lay.k){ rows.add(k[5]); cols.add(k[6]); }
  const rowList = [...rows].sort((a, b) => a - b);
  const colList = [...cols].sort((a, b) => a - b);
  const ri = new Map(rowList.map((v, i) => [v, i]));
  const ci = new Map(colList.map((v, i) => [v, i]));
  const off = lay.off || 0;
  const keys = lay.k.map(function(k){
    const li = k[0] + off;
    return { li: li, nx: k[1] + k[3] / 2, ny: k[2] + k[4] / 2,
             x: k[1], y: k[2], w: k[3], h: k[4],
             r: ri.get(k[5]), c: ci.get(k[6]), name: k[7] || '' };
  });
  const G = {
    key: key, name: key, w: lay.w, h: lay.h, leds: Math.max(lay.leds, ...keys.map(k => k.li + 1)),
    keys: keys, cols: colList.length, rows: rowList.length,
    out: new Uint8Array(Math.max(lay.leds, ...keys.map(k => k.li + 1)) * 3)
  };
  G.cell = function(li){
    const k = keys.find(x => x.li === li);
    return k ? [k.r, k.c] : [0, 0];
  };
  G.byName = new Map();
  for (const k of keys) if (k.name) G.byName.set(k.name, k);
  return G;
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function outputInfo(device){
  let best = null;
  for (const c of (device.collections || [])){
    for (const r of (c.outputReports || [])){
      let bytes = 0;
      for (const it of (r.items || [])) bytes += Math.ceil(((it.reportSize || 0) * (it.reportCount || 0)) / 8);
      if (!best || bytes > best.bytes) best = { reportId: r.reportId || 0, bytes };
    }
  }
  return best || { reportId: 0, bytes: 64 };
}

// ===== RDR 协议层 =====
// 65 字节定长包，sendReport 的 payload 已剥离 reportId：
//   payload[0]=0xAA  [1]=cmd  [2..3]=offset LE  [4]=len  [5..7]=0  [8..]=data
// 应答同样是 payload[0]=0xAA [1]=cmd [8..]=data
const CMD = {
  START: 0x10, STOP: 0x11, GET_DEVINFO: 0x12,
  GET_FUNC: 0x14, SET_FUNC: 0x15,
  LIGHT_SYNC: 0x2E, CLOSE_SYNC: 0x2F, GET_MATRIX: 0x32,
  SET_CUSTOM: 0x3B, SET_AURORA: 0x3C, PREPARE: 0x3D
};

function build(cmd, offset, len, data){
  const b = new Uint8Array(S.bufLen);
  b[0] = MAGIC; b[1] = cmd;
  b[2] = offset & 0xFF; b[3] = (offset >> 8) & 0xFF; b[4] = len & 0xFF;
  if (data) for (let i = 0; i < len; i++) b[8 + i] = data[i] & 0xFF || 0;
  return b;
}

// ===== 收包：常驻监听队列 =====
// 关键点：不能在 sendReport 之后才 addEventListener——固件回包可能在注册前就到，
// 那一包会被静默丢掉，表现为"命令发出去了但永远没回应"。
function hexOf(u, n){
  const k = Math.min(u.length, n || 16);
  let s = '';
  for (let i = 0; i < k; i++) s += u[i].toString(16).padStart(2, '0') + ' ';
  return s.trim();
}

function attachRx(dev){
  // hook 挂在设备对象上，避免多接口探测时互相覆盖导致无法移除
  if (dev.__rxHook){
    try { dev.removeEventListener('inputreport', dev.__rxHook); } catch (e){}
  }
  dev.__rxHook = function(e){
    const dv = e.data;
    const u = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
    S.rx.push(u);
    if (S.rx.length > 64) S.rx.shift();
    diag('rx', 'id=' + e.reportId + ' len=' + u.length + '  ' + hexOf(u, 20));
  };
  dev.addEventListener('inputreport', dev.__rxHook);
  S.rx = [];
}

function detachRx(dev){
  const d = dev || S.dev;
  if (d && d.__rxHook){
    try { d.removeEventListener('inputreport', d.__rxHook); } catch (e){}
    d.__rxHook = null;
  }
  S.rx = [];
}

function drain(){ if (S.rx) S.rx.length = 0; }

function waitInput(timeout){
  const deadline = performance.now() + (timeout || 1200);
  return new Promise(function(resolve, reject){
    const iv = setInterval(function(){
      if (S.rx && S.rx.length){
        clearInterval(iv);
        resolve(S.rx.shift());
      } else if (performance.now() > deadline){
        clearInterval(iv);
        reject(new Error('timeout'));
      }
    }, 4);
  });
}

async function send(cmd, offset, len, data){
  const off = offset === undefined ? 0 : offset;
  const n = len || 0;
  const payload = build(cmd, off, n, data);
  try {
    await S.dev.sendReport(S.reportId, payload);
    diag('tx', 'cmd=0x' + cmd.toString(16).padStart(2, '0')
      + ' off=' + off + ' len=' + n + '  ' + hexOf(payload, 12));
  } catch (e){
    diag('er', 'sendReport 失败 cmd=0x' + cmd.toString(16)
      + ' len=' + payload.length + '：' + e.message,
      'sendReport failed cmd=0x' + cmd.toString(16) + ' len=' + payload.length + ': ' + e.message);
    throw e;
  }
}

// 解析回包前缀，定位 status 与数据起点
function parseReply(r){
  if (!r || !r.length) return { status: -1, base: 8 };
  if (r[0] === MAGIC) return { status: r[7], base: 8 };
  if (r[1] === MAGIC) return { status: r[8], base: 9 };
  return { status: -1, base: 0 };
}

function stName(st){
  if (st === ST_OK) return L('0x55 成功', '0x55 OK');
  if (st === ST_FAIL) return L('0x0F 被固件拒绝', '0x0F rejected by firmware');
  if (st === undefined || st === null || st < 0) return L('无 status（不是 RDR 回包）', 'no status (not an RDR reply)');
  return '0x' + st.toString(16) + L(' 未知', ' unknown');
}

// 发一条命令并等它的执行结果：这是判断"到底哪一步被拒"的唯一依据
async function request(cmdByte, off, len, data, timeout){
  const payload = build(cmdByte, off === undefined ? 0 : off, len || 0, data);
  drain();
  try {
    await S.dev.sendReport(S.reportId, payload);
  } catch (e){
    diag('er', 'sendReport 失败 cmd=0x' + cmdByte.toString(16) + '：' + e.message,
      'sendReport failed cmd=0x' + cmdByte.toString(16) + ': ' + e.message);
    return null;
  }
  diag('tx', 'cmd=0x' + cmdByte.toString(16).padStart(2, '0')
    + ' off=' + (off || 0) + ' len=' + (len || 0) + '  ' + hexOf(payload, 12));

  // 推流时固件会对每帧回包，队列里可能残留上一帧的应答，
  // 所以要按 cmd 号挑出属于自己的那条，不能拿到就用
  let r = null;
  const deadline = performance.now() + (timeout || 1200);
  while (performance.now() < deadline){
    let cand;
    try {
      cand = await waitInput(Math.max(50, deadline - performance.now()));
    } catch (e){ break; }
    const c1 = cand[1], c2 = cand[2];
    if (cand[0] === MAGIC && (c1 === cmdByte || c1 === undefined)){ r = cand; break; }
    if (cand[1] === MAGIC && c2 === cmdByte){ r = cand; break; }
    // 不是这条命令的应答，丢掉继续等
  }
  if (!r){
    diag('warn', 'cmd=0x' + cmdByte.toString(16).padStart(2, '0') + ' 无匹配回包（超时）',
      'cmd=0x' + cmdByte.toString(16).padStart(2, '0') + ' no matching reply (timeout)');
    return null;
  }
  const p = parseReply(r);
  p.frame = r;
  const kind = p.status === ST_OK ? 'ok' : (p.status === ST_FAIL ? 'er' : 'warn');
  diag(kind, 'ack cmd=0x' + cmdByte.toString(16).padStart(2, '0')
    + ' → ' + stName(p.status) + '  ' + hexOf(r, 16));
  return p;
}

async function readChunked(cmdByte, total, waitMs){
  const out = [];
  let miss = 0;
  while (out.length < total && miss < 4){
    const off = out.length;
    const n = Math.min(S.chunk, total - off);
    const p = await request(cmdByte, off, n, null, waitMs || 800);
    if (!p){ miss++; await sleep(40); continue; }
    if (p.status === ST_FAIL){
      diag('er', '读 cmd=0x' + cmdByte.toString(16) + ' off=' + off + ' 被固件拒绝',
        'read cmd=0x' + cmdByte.toString(16) + ' off=' + off + ' rejected by firmware');
      miss++;
      await sleep(40);
      continue;
    }
    const r = p.frame, base = p.base;
    for (let i = 0; i < n; i++) out.push(r[base + i] || 0);
    miss = 0;
  }
  return out;
}

// 固件对小配列有最小帧长要求，短帧会被整包丢弃
function auroraLedCount(inf, fallback){
  const base = (inf && inf.lightSize) ? inf.lightSize : (fallback || 80);
  const kt = inf ? inf.keyboardType : 0;
  const pid = inf ? inf.productId : 0;
  if (kt === 102) return Math.max(base, 107);
  if (kt === 103) return Math.max(base, 82);
  if (pid === 12331) return Math.max(base, 107);   // PMO P75
  return Math.max(base, 82);
}

async function readDeviceInfo(){
  const d = await readChunked(CMD.GET_DEVINFO, 56, 800);
  if (!d || d.length < 24) return null;
  S.devInfo = {
    productId: d[4] | (d[5] << 8),
    protocolVer: d[8], profile: d[9], keyboardID: d[10], keyboardType: d[11],
    lightSize: d[15], maxBright: d[16], maxSpeed: d[17],
    showLogo: d[19] === 1, showSide: d[23] === 1, showEncoder: d[37] === 1,
    raw: d
  };
  return S.devInfo;
}

// funcInfo：protocolVer>=2 时 58 字节（含 logo/side/matrix 三块），否则 41 字节
// 实测：WAVE75 的 funcInfo 固定 64 字节。原厂构建方式是 Array(64).fill(0)，
// 只写 58 字节时固件认为整表未完成，SET_FUNCINFO 返回 0x55 却完全不生效。
function funcLen(){ return 64; }

async function readFuncInfo(){
  const total = funcLen();
  const f = await readChunked(CMD.GET_FUNC, total, 800);
  if (!f || f.length < total){
    // 读不满就退回 41 字节再试一次
    if (total === 58){
      const g = await readChunked(CMD.GET_FUNC, 41, 800);
      if (g && g.length >= 41){ S.funcInfo = g; S.funcLen = 41; return g; }
    }
    return null;
  }
  S.funcInfo = f; S.funcLen = total;
  return f;
}

async function writeFuncInfo(f){
  const res = [];
  for (let off = 0; off < f.length; off += S.chunk){
    const n = Math.min(S.chunk, f.length - off);
    const p = await request(CMD.SET_FUNC, off, n, f.slice(off, off + n), 1200);
    res.push(p ? p.status : -1);
    await sleep(15);
  }
  return res;
}

// ===== 开启实时灯效通道 =====
// 实测结论（WAVE75 / VID 14036? 不，14000 / PID 0x3009 / MI_01）：
//   · 逐键推帧用 0x2E SET_LIGHT_SYNC（RGB565），不是 0x3C。0x3C 是推给"矩阵屏"的，
//     WAVE75 的 layouts 里 screen="0"，没有矩阵屏，发 0x3C 一律返回 0x0F。
//   · funcInfo 固定 64 字节。写 58 字节固件会静默丢弃，返回 0x55 但完全不生效。
//   · 主键区 lightSwitch=0 就表示灯是开的（原厂在"关闭"时反而写 1），不要动它。
//   · 只需把 lightMode 改成 253（自定义实时），推帧才会显色。
async function armMatrix(){
  if (!S.dev) return;
  const btn = $('btnBase');
  btn.disabled = true;
  try {
    diag('ok', '—— 开始开启实时灯效 ——', '—— enabling live lighting ——');

    const a1 = await request(CMD.START, 0, 0, null, 900);
    if (!a1){
      setStatus('键盘没有任何回应。多半是选到了别的 HID 接口——重新点「连接键盘」，把弹窗里同名的几个条目都勾上再试', '#d98d85',
        'No reply from the keyboard. You probably picked a different HID interface — click "Connect keyboard" again and tick every same-named entry in the dialog.');
      return;
    }

    if (!S.devInfo) await readDeviceInfo();
    const inf = S.devInfo || { maxBright: 160, maxSpeed: 4, lightSize: 80 };
    const maxB = Math.min(255, inf.maxBright || 160);

    const f = await readFuncInfo();
    if (!f || f.length < 40){
      setStatus('读不到灯效参数表，无法安全改写——先确认键盘没被 PMOHub 网页/客户端占着', '#d98d85',
        'Cannot read the lighting parameter table, so writing would be unsafe — make sure the PMOHub web page or app is not holding the keyboard.');
      diag('er', 'funcInfo 读取失败，已中止（不盲写）', 'funcInfo read failed, aborted (never blind-write)');
      return;
    }
    diag('ok', '参数表 ' + f.length + ' 字节：switch=' + f[1] + ' mode=' + f[2]
      + ' bright=' + f[3] + ' speedRev=' + f[4],
      'param table ' + f.length + 'B: switch=' + f[1] + ' mode=' + f[2]
      + ' bright=' + f[3] + ' speedRev=' + f[4]);
    diag('ok', 'logo[' + f[13] + '] side[' + f[22] + '] matrix[' + f[31] + ']（只读，不改）',
      'logo[' + f[13] + '] side[' + f[22] + '] matrix[' + f[31] + '] (read-only, untouched)');

    if (S.origMode === null){
      S.origMode = f[2]; S.origSwitch = f[1]; S.origCustom = f[10];
    }

    const before = f[2], beforeSlot = f[10];
    f[1] = 0;                                        // lightSwitch：0=开，1 才是关
    f[2] = 253;                                      // lightMode：253=自定义实时
    f[10] = clamp(f[10] | 0, 0, 4);                  // lightCustomIndex：占用哪个自定义槽
    if (!f[3]) f[3] = maxB;                          // 亮度为 0 才补，避免改掉用户设定
    diag('ok', 'mode ' + before + ' → 253 · 自定义槽 ' + beforeSlot + ' → ' + f[10]
      + '（WAVE75 固件只有「自定义一」一个槽，所以键盘面板/助手会显示自定义一，这是正常现象）',
      'mode ' + before + ' → 253 · custom slot ' + beforeSlot + ' → ' + f[10]
      + ' (WAVE75 firmware has only one custom slot, so the panel/app showing "Custom 1" is expected)');

    const res = await writeFuncInfo(f);
    const allOk = res.length && res.every(x => x === ST_OK);
    diag(allOk ? 'ok' : 'warn', '写参数：' + res.map(x => x < 0 ? '无应答' : '0x' + x.toString(16)).join(' / '),
      'write params: ' + res.map(x => x < 0 ? 'no reply' : '0x' + x.toString(16)).join(' / '));

    // 固件要等 STOP_COMM 才真正提交参数表：不 STOP 直接回读只能拿到旧值。
    // 这一步漏掉的话，写入明明返回 0x55，却像从来没发生过一样。
    diag('tx', 'STOP_COMM 提交参数…', 'STOP_COMM to commit params…');
    try { await request(CMD.STOP, 0, 0, null, 700); } catch (e){}
    await sleep(80);
    try { await request(CMD.START, 0, 0, null, 900); } catch (e){}
    await sleep(60);

    // 回读确认：这一步是判定"到底写进去没有"的唯一依据
    const chk = await readFuncInfo();
    const applied = !!(chk && chk[2] === 253);
    diag(applied ? 'ok' : 'er', '回读 mode=' + (chk ? chk[2] : '?')
      + (applied ? ' → 已生效' : ' → 未生效（写入被忽略）'),
      'read back mode=' + (chk ? chk[2] : '?')
      + (applied ? ' → applied' : ' → not applied (write ignored)'));

    S.armed = true;
    S.ledCount = auroraLedCount(inf, S.G ? S.G.leds : 80);
    setStatus('实时通道已开启 · mode ' + before + '→253 · ' + S.ledCount + ' 灯 · 亮度上限 ' + maxB
      + (applied ? '' : ' · ⚠ 参数未确认'), applied ? '#7ec89a' : '#d9b45c',
      'Live channel on · mode ' + before + '→253 · ' + S.ledCount + ' LEDs · max brightness ' + maxB
      + (applied ? '' : ' · parameters unconfirmed'));
    $('sPush').textContent = 'ready';

    diag('ok', '推测试帧（全红）', 'pushing a test frame (all red)');
    await testFrame(255, 0, 0);
  } catch (e){
    diag('er', '开启失败：' + e.message, 'enable failed: ' + e.message);
    setStatus('开启失败：' + e.message + ' · 已尝试还原灯效模式', '#d98d85',
      'Enable failed: ' + e.message + ' · tried to restore the lighting mode');
    // 中途炸掉必须把模式还原，否则键盘会卡在"自定义"上、帧一停就定格
    S.armed = false;
    try { await restoreMode(); } catch (e2){}
  } finally {
    btn.disabled = false;
  }
}

// 把 lightMode 还原成开启前的值：stopAll 和异常分支共用
async function restoreMode(){
  if (S.origMode === null || !S.dev) return false;
  const f = await readFuncInfo();
  if (f && f.length >= 40 && f[2] === 253){
    f[2] = S.origMode;
    if (S.origSwitch === 1) f[1] = 1;            // 原来灯是关的就关回去
    if (S.origCustom !== null && S.origCustom !== undefined) f[10] = S.origCustom;
    await writeFuncInfo(f);
    try { await request(CMD.STOP, 0, 0, null, 700); } catch (e){}
    await sleep(60);
    try { await request(CMD.START, 0, 0, null, 900); } catch (e){}
    diag('ok', '已把灯效模式还原为 ' + S.origMode + '（switch=' + f[1] + '）',
      'lighting mode restored to ' + S.origMode + ' (switch=' + f[1] + ')');
  }
  S.origMode = null; S.origSwitch = null; S.origCustom = null;
  return true;
}

// 推一帧纯色，确认链路是否真的通
// 实测：单帧有时会被固件当成"半包"丢掉，连推 3 帧能稳定锁存
async function testFrame(r, g, b){
  if (!S.dev || !S.armed) return;
  const n = Math.max(S.ledCount || 0, 82);
  const frame = new Uint8Array(n * 2);
  const enc = rgb565(r, g, b);
  for (let i = 0; i < n; i++){ frame[i * 2] = enc[0]; frame[i * 2 + 1] = enc[1]; }
  try {
    for (let k = 0; k < 3; k++){
      for (let off = 0; off < frame.length; off += S.chunk){
        const len = Math.min(S.chunk, frame.length - off);
        await request(CMD.LIGHT_SYNC, off, len, frame.subarray(off, off + len), 900);
      }
      await sleep(50);
    }
    diag('ok', '测试帧已发 ×3（' + frame.length + ' 字节，' + n + ' 灯），键盘此刻应整片变红',
      'test frame sent ×3 (' + frame.length + 'B, ' + n + ' LEDs) — the keyboard should be all red now');
  } catch (e){
    diag('er', '测试帧发送失败：' + e.message, 'test frame failed: ' + e.message);
  }
}

// 把当前画面写进板载「自定义」槽：384 字节 RGB888（128 键 × 3），掉电保留
// 命令 0x23 = SET_USERLIGHT_1（槽 0），0x25/0x27/0x29/0x2B 依次是槽 1~4
const CMD_SLOT = [0x23, 0x25, 0x27, 0x29, 0x2B];
async function writeSlot(){
  if (!S.dev || !S.G){ setStatus('先连接键盘', '#d98d85', 'Connect the keyboard first'); return; }
  // 说清楚写进去的是什么：板载槽只有 128 键 × 1 帧的容量，存的是"当前这一瞬间"的静态 RGB，
  // 动画本身永远留在本页，关掉页面就不会继续。
  const ask = L(
    '「写死到自定义一」保存的是【当前这一帧的静态 RGB 快照】（128 键 × 1 帧），不是动画。\n\n· 动画无法存进板载：槽里只有一帧的空间\n· 写入会覆盖键盘原来的自定义一存档，掉电保留\n\n继续写入吗？',
    'Save to Custom 1 stores ONE static RGB snapshot of the frame on screen right now (128 keys x 1 frame) — not the animation.\n\n· The slot only holds a single frame, so an animation cannot be stored\n· Writing overwrites the existing Custom 1 profile and survives power-off\n\nContinue?'
  );
  if (!confirm(ask)) return;
  const btn = $('btnSlot');
  btn.disabled = true;
  try {
    setStatus('写入自定义槽…（只写当前这一帧的静态 RGB）', '#d9b45c',
      'Writing to the custom slot… (static RGB of this single frame only)');
    const f = await readFuncInfo();
    const slot = clamp((f && f[10]) | 0, 0, 4);
    const buf = new Uint8Array(384);
    const G = S.G, out = G.out;
    for (const k of G.keys){
      const li = k.li;
      if (li < 0 || li * 3 + 2 >= 384) continue;
      buf[li * 3] = out[li * 3]; buf[li * 3 + 1] = out[li * 3 + 1]; buf[li * 3 + 2] = out[li * 3 + 2];
    }
    await request(CMD.START, 0, 0, null, 900);
    const res = [];
    for (let off = 0; off < 384; off += S.chunk){
      const len = Math.min(S.chunk, 384 - off);
      const p = await request(CMD_SLOT[slot], off, len, buf.subarray(off, off + len), 900);
      res.push(p ? p.status : -1);
      await sleep(12);
    }
    await request(CMD.STOP, 0, 0, null, 700);
    const ok = res.every(x => x === ST_OK);
    diag(ok ? 'ok' : 'warn', '写槽 ' + slot + '（0x' + CMD_SLOT[slot].toString(16) + '）：'
      + res.map(x => x < 0 ? '无应答' : '0x' + x.toString(16)).join(' / '),
      'slot write ' + slot + ' (0x' + CMD_SLOT[slot].toString(16) + '): '
      + res.map(x => x < 0 ? 'no reply' : '0x' + x.toString(16)).join(' / '));
    setStatus(ok ? '已写入「自定义' + (slot + 1) + '」· 静态帧，掉电保留 · 切走再切回即可看到'
      : '写槽未全部成功，看诊断日志', ok ? '#7ec89a' : '#d9b45c',
      ok ? ('Saved to "Custom ' + (slot + 1) + '" · static frame, kept after power off · switch away and back to see it')
         : 'Slot write was not fully acknowledged — check the diagnostics');
  } catch (e){
    diag('er', '写槽失败：' + e.message, 'slot write failed: ' + e.message);
    setStatus('写槽失败：' + e.message, '#d98d85', 'Slot write failed: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function readLightMatrix(){
  if (!S.dev) return;
  try {
    setStatus('读取灯矩阵…', '#d9b45c', 'Reading LED matrix…');
    const m = await readChunked(CMD.GET_MATRIX, 128, 800);
    let valid = 0, maxLed = -1;
    for (let i = 0; i < m.length; i++){
      if (m[i] !== 255){ valid++; if (m[i] > maxLed) maxLed = m[i]; }
    }
    setStatus('灯矩阵：' + valid + ' 个有效灯位，最大灯号 ' + maxLed, '#7ec89a',
      'LED matrix: ' + valid + ' valid positions, highest index ' + maxLed);
    $('sLeds').textContent = valid;
  } catch (e){
    setStatus('读灯矩阵失败：' + e.message, '#d98d85', 'Reading LED matrix failed: ' + e.message);
  }
}

async function stopAll(){
  if (!S.dev) return;
  S.armed = false;
  try {
    // 把 mode 还原成开启前那个，否则键盘会停在"自定义"上，帧一停就全黑
    if (S.origMode !== null) await restoreMode();
    try { await request(CMD.CLOSE_SYNC, 0, 0, null, 400); } catch (e){}
    await sleep(20);
    try { await request(CMD.STOP, 0, 0, null, 400); } catch (e){}
    setStatus('已停止，灯效交还固件', '#7ec89a', 'Stopped — lighting handed back to the firmware');
    $('sPush').textContent = '—';
  } catch (e){ setStatus('停止失败：' + e.message, '#d98d85', 'Stop failed: ' + e.message); }
}
async function pushFrame(){
  if (!S.dev || S.pushBusy || !S.armed) return;
  S.pushBusy = true;
  try {
    const G = S.G, out = G.out;
    const n = Math.max(S.ledCount || 0, G.leds, 82);   // 实机 164 字节（82 颗），别让短帧被固件当半包丢掉
    const frame = new Uint8Array(n * 2);
    for (let i = 0; i < n; i++){
      if (i < G.leds){
        const enc = rgb565(out[i * 3], out[i * 3 + 1], out[i * 3 + 2]);
        frame[i * 2] = enc[0]; frame[i * 2 + 1] = enc[1];
      }
      // 超出布局的灯位留黑，避免固件按短帧丢弃整包
    }
    for (let off = 0; off < frame.length; off += S.chunk){
      const len = Math.min(S.chunk, frame.length - off);
      await S.dev.sendReport(S.reportId,
        build(CMD.LIGHT_SYNC, off, len, frame.subarray(off, off + len)));
    }
    S.pushAt = performance.now();
    $('sPush').textContent = 'ok ' + frame.length + 'B';
  } catch (e){
    $('sPush').textContent = 'err';
  }
  S.pushBusy = false;
}

function setStatus(t, c, en){
  S.lastStatus = [t, c, en];
  const el = $('devStatus');
  el.textContent = (LANG === 'en' && en) ? en : t;
  el.style.borderLeft = '3px solid ' + (c || 'transparent');
}

function setLayout(key){
  if (!LAYOUTS[key]) return;
  S.layoutKey = key;
  S.G = buildGrid(key);
  S.heat = new Float32Array(S.G.leds);
  S.fx = EFFECTS[S.fxIdx].init(S.G, S);
  const cv = $('cv');
  cv.width = S.G.w; cv.height = S.G.h;
  $('sLayout').textContent = key + ' · ' + S.G.leds + L(' 灯', ' LEDs');
  $('sLeds').textContent = S.G.leds;
  $('selLayout').value = key;
}
function startFx(i){
  S.fxIdx = i;
  if (S.G) S.fx = EFFECTS[i].init(S.G, S);
  $('sFx').textContent = fxName(EFFECTS[i]);
  [...$('fxList').children].forEach(function(b, j){ b.classList.toggle('on', j === i); });
}

function draw(){
  const G = S.G, cv = $('cv'), ctx = cv.getContext('2d');
  ctx.fillStyle = '#111110';
  ctx.fillRect(0, 0, cv.width, cv.height);
  const out = G.out;
  for (const k of G.keys){
    const x = k.x * G.w, y = k.y * G.h, w = k.w * G.w, h = k.h * G.h;
    const r = out[k.li * 3], g = out[k.li * 3 + 1], b = out[k.li * 3 + 2];
    const lum = (r * 0.3 + g * 0.6 + b * 0.1) / 255;
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    const pad = 1.5;
    roundRect(ctx, x + pad, y + pad, w - pad * 2, h - pad * 2, 4);
    ctx.fill();
    if (lum > 0.06){
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.06 + lum * 0.22) + ')';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }
}

function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function tick(now){
  requestAnimationFrame(tick);
  if (!S.G) return;
  if (!S.last) S.last = now;
  let dt = (now - S.last) / 1000;
  S.last = now;
  if (dt > 0.12) dt = 0.12;
  S.t += dt * S.params.speed;

  const p = S.params;
  p.bright = +$('pBright').value;

  S.fx(S.t, dt, S.G.out, p, null);

  const br = p.bright / 100;
  if (br < 1){
    const out = S.G.out;
    for (let i = 0; i < out.length; i++) out[i] = out[i] * br;
  }

  draw();

  S.frames++;
  if (now - S.fpsT > 500){
    S.fpsShown = Math.round(S.frames * 1000 / (now - S.fpsT));
    S.frames = 0; S.fpsT = now;
    $('sFps').textContent = S.fpsShown;
  }

  if (S.dev && S.armed && now - S.pushAt > Math.max(1000 / p.fps, 33)) pushFrame();
}

// 效果名要跟着界面语言走（中文名 / 英文名成对写在 EFFECTS 里）
function fxName(fx){ return LANG === 'en' ? (fx.en || fx.name) : fx.name; }

function initPlasma(G){
  return function(t, dt, out, p){
    const s = p.scale * 9;
    for (const k of G.keys){
      const x = k.nx, y = k.ny;
      let v = Math.sin(x * s + t * 1.3)
            + Math.sin(y * s * 1.2 - t * 0.9)
            + Math.sin((x + y) * s * 0.7 + t * 1.7)
            + Math.sin(Math.hypot(x - 0.5, y - 0.5) * s * 2.2 - t * 2.1);
      v = v / 4 * 0.5 + 0.5;
      const c = hsv(v * 0.85 + 0.55, 1, 0.55 + v * 0.45);
      out[k.li * 3] = c[0]; out[k.li * 3 + 1] = c[1]; out[k.li * 3 + 2] = c[2];
    }
  };
}

function initAurora(G){
  const bands = [];
  for (let i = 0; i < 5; i++) bands.push({ ph: Math.random() * 6.28, sp: 0.15 + Math.random() * 0.25, amp: 0.08 + Math.random() * 0.1 });
  return function(t, dt, out, p){
    for (const k of G.keys){
      let h = 0;
      for (const b of bands){
        h += Math.sin(k.nx * 3.2 * p.scale + b.ph + t * b.sp) * b.amp;
      }
      const y = k.ny + h;
      let v = Math.sin(y * 8 - t * 0.6) * 0.5 + 0.5;
      v = Math.pow(v, 2.2);
      const c = hsv(0.36 + y * 0.22 + Math.sin(t * 0.2) * 0.06, 1 - v * 0.35, 0.15 + v * 0.85);
      out[k.li * 3] = c[0]; out[k.li * 3 + 1] = c[1]; out[k.li * 3 + 2] = c[2];
    }
  };
}

function initLife(G){
  const cols = G.cols, rows = G.rows;
  let grid = new Uint8Array(cols * rows);
  let age = new Float32Array(cols * rows);
  const cells = G.keys.map(k => ({ li: k.li, i: k.r * cols + k.c }));
  for (let i = 0; i < grid.length; i++) grid[i] = Math.random() < 0.32 ? 1 : 0;
  let acc = 0;
  return function(t, dt, out, p){
    acc += dt * p.speed;
    if (acc > 0.16){
      acc = 0;
      const ng = new Uint8Array(grid.length);
      for (let r = 0; r < rows; r++){
        for (let c = 0; c < cols; c++){
          let n = 0;
          for (let dr = -1; dr <= 1; dr++){
            for (let dc = -1; dc <= 1; dc++){
              if (!dr && !dc) continue;
              const rr = (r + dr + rows) % rows, cc = (c + dc + cols) % cols;
              n += grid[rr * cols + cc];
            }
          }
          const alive = grid[r * cols + c];
          ng[r * cols + c] = alive ? (n === 2 || n === 3 ? 1 : 0) : (n === 3 ? 1 : 0);
          age[r * cols + c] = ng[r * cols + c] ? Math.min(1, age[r * cols + c] + 0.25) : age[r * cols + c] * 0.6;
        }
      }
      grid = ng;
      let alive = 0;
      for (let i = 0; i < grid.length; i++) alive += grid[i];
      if (alive < 4 || alive > grid.length * 0.75){
        for (let i = 0; i < grid.length; i++) grid[i] = Math.random() < 0.3 ? 1 : 0;
      }
    }
    out.fill(6);
    for (const k of cells){
      const a = age[k.i];
      const c = grid[k.i] ? hsv(0.45 + a * 0.08, 1, 0.45 + a * 0.55) : [8, 14, 20];
      out[k.li * 3] = c[0]; out[k.li * 3 + 1] = c[1]; out[k.li * 3 + 2] = c[2];
    }
  };
}

function initRain(G){
  const cols = G.cols, rows = G.rows;
  const head = new Float32Array(cols), speed = new Float32Array(cols), len = new Float32Array(cols);
  const cells = G.keys.map(k => ({ li: k.li, r: k.r, c: k.c }));
  for (let c = 0; c < cols; c++){
    head[c] = Math.random() * rows * 2 - rows;
    speed[c] = 3 + Math.random() * 5;
    len[c] = 2 + Math.random() * 3.5;
  }
  return function(t, dt, out, p){
    out.fill(0);
    for (let c = 0; c < cols; c++){
      head[c] += dt * speed[c] * p.speed;
      if (head[c] - len[c] > rows){ head[c] = -Math.random() * rows; len[c] = 2 + Math.random() * 3.5; }
    }
    for (const k of cells){
      const d = head[k.c] - k.r;
      if (d >= 0 && d < len[k.c]){
        const f = 1 - d / len[k.c];
        const c = hsv(0.33, 1, 0.25 + f * 0.75);
        out[k.li * 3] = c[0] * 0.85; out[k.li * 3 + 1] = c[1]; out[k.li * 3 + 2] = c[2] * 0.9;
      }
    }
  };
}

function initSpiral(G){
  return function(t, dt, out, p){
    for (const k of G.keys){
      const dx = k.nx - 0.5, dy = (k.ny - 0.5) * 2.2;
      const ang = Math.atan2(dy, dx) / 6.283;
      const rad = Math.hypot(dx, dy);
      const v = ((ang + rad * 0.9 * p.scale - t * 0.35) % 1 + 1) % 1;
      const c = hsv(v, 1, 0.95);
      out[k.li * 3] = c[0]; out[k.li * 3 + 1] = c[1]; out[k.li * 3 + 2] = c[2];
    }
  };
}

function initComet(G){
  const arms = [
    { ph: 0, hue: 0.55 }, { ph: 2.09, hue: 0.92 }, { ph: 4.18, hue: 0.35 }
  ];
  return function(t, dt, out, p){
    out.fill(3);
    for (const a of arms){
      const ang = t * 0.8 * p.speed + a.ph;
      const cx = 0.5 + Math.cos(ang) * 0.44;
      const cy = 0.5 + Math.sin(ang * 1.3) * 0.32;
      for (const k of G.keys){
        const d = Math.hypot(k.nx - cx, (k.ny - cy) * 1.9);
        const v = Math.max(0, 1 - d * (5.5 / p.scale));
        if (v > 0.02){
          const c = hsv(a.hue - d * 0.15, 0.85, Math.min(1, v * 1.2));
          const i = k.li * 3;
          out[i] = Math.min(255, out[i] + c[0]);
          out[i + 1] = Math.min(255, out[i + 1] + c[1]);
          out[i + 2] = Math.min(255, out[i + 2] + c[2]);
        }
      }
    }
  };
}

function initLissajous(G){
  return function(t, dt, out, p){
    out.fill(2);
    const ax = 3 * p.scale, ay = 4 * p.scale;
    for (let s = 0; s < 3; s++){
      const ph = t * 0.9 * p.speed + s * 2.1;
      for (let j = 0; j < 26; j++){
        const px = 0.5 + Math.sin(ax * (ph - j * 0.045)) * 0.46;
        const py = 0.5 + Math.sin(ay * (ph - j * 0.045) + 1.57) * 0.38;
        const fade = 1 - j / 26;
        for (const k of G.keys){
          const d = Math.hypot(k.nx - px, (k.ny - py) * 1.7);
          if (d < 0.045){
            const c = hsv(0.55 + s * 0.14, 0.9, fade);
            const i = k.li * 3;
            out[i] = Math.min(255, out[i] + c[0]);
            out[i + 1] = Math.min(255, out[i + 1] + c[1]);
            out[i + 2] = Math.min(255, out[i + 2] + c[2]);
          }
        }
      }
    }
  };
}

function initMeta(G){
  const balls = [{ a: 0, r: 0.16, h: 0.55 }, { a: 2.1, r: 0.2, h: 0.88 }, { a: 4.2, r: 0.13, h: 0.33 }];
  return function(t, dt, out, p){
    const pos = balls.map(function(b){
      return { x: 0.5 + Math.cos(t * 0.6 * p.speed + b.a) * b.r * 1.6,
               y: 0.5 + Math.sin(t * 0.9 * p.speed + b.a * 1.7) * b.r,
               h: b.h };
    });
    for (const k of G.keys){
      let f = 0, hue = 0;
      for (const q of pos){
        const d2 = (k.nx - q.x) * (k.nx - q.x) + (k.ny - q.y) * (k.ny - q.y) * 2.6;
        const g = 0.009 * p.scale / (d2 + 0.0012);
        if (g > f){ f = g; hue = q.h; }
      }
      const v = clamp(f - 0.35, 0, 1);
      const c = hsv(hue + v * 0.1, 0.95, Math.pow(v, 0.7));
      out[k.li * 3] = c[0]; out[k.li * 3 + 1] = c[1]; out[k.li * 3 + 2] = c[2];
    }
  };
}

function initJelly(G){
  const col = new Float32Array(G.leds * 3);
  let acc = 0;
  return function(t, dt, out, p){
    acc += dt * p.speed;
    if (acc > 0.09){
      acc = 0;
      for (let n = 0; n < 2; n++){
        const li = Math.floor(Math.random() * G.leds);
        const c = hsv(Math.random(), 0.85, 1);
        col[li * 3] = c[0]; col[li * 3 + 1] = c[1]; col[li * 3 + 2] = c[2];
      }
    }
    for (let i = 0; i < col.length; i++) col[i] *= (1 - dt * 0.65);
    out.set(col);
  };
}

function initEQ(G){
  const cols = G.cols;
  const levels = new Float32Array(cols);
  return function(t, dt, out, p, audio){
    out.fill(2);
    for (let c = 0; c < cols; c++){
      let target = 0;
      if (audio && audio.length){
        const seg = audio[Math.floor(c / cols * audio.length)];
        target = seg;
      } else {
        target = (Math.sin(t * 2.4 + c * 0.55) * 0.5 + 0.5) * (0.3 + Math.random() * 0.7);
      }
      levels[c] += (target - levels[c]) * Math.min(1, dt * 12);
      const hgt = levels[c] * G.rows;
      for (const k of G.keys){
        if (k.c !== c) continue;
        const fromBottom = G.rows - 1 - k.r;
        if (fromBottom < hgt){
          const f = 1 - fromBottom / Math.max(1, hgt);
          const col = hsv(0.33 - clamp(fromBottom / G.rows, 0, 1) * 0.33, 1, 0.35 + f * 0.65);
          out[k.li * 3] = col[0]; out[k.li * 3 + 1] = col[1]; out[k.li * 3 + 2] = col[2];
        }
      }
    }
  };
}

function initWave(G){
  return function(t, dt, out, p){
    for (const k of G.keys){
      const v = ((k.nx * 1.2 * p.scale - t * 0.35) % 1 + 1) % 1;
      const c = hsv(v, 0.95, 0.9);
      out[k.li * 3] = c[0]; out[k.li * 3 + 1] = c[1]; out[k.li * 3 + 2] = c[2];
    }
  };
}

// ===================== 追加移植的效果 =====================

// FastLED RainbowWithGlitter：彩虹底 + 随机白色碎闪
function initGlitter(G){
  return function(t, dt, out, p){
    for (const k of G.keys){
      const v = ((k.nx * 0.55 + k.ny * 0.25 + t * 0.10) % 1 + 1) % 1;
      const c = hsv(v, 1, 0.8);
      const i = k.li * 3;
      out[i] = c[0]; out[i + 1] = c[1]; out[i + 2] = c[2];
    }
    const n = Math.max(1, Math.round(G.keys.length * 0.05 * p.scale));
    for (let j = 0; j < n; j++){
      if (Math.random() > 0.45) continue;
      const k = G.keys[(Math.random() * G.keys.length) | 0];
      const i = k.li * 3;
      out[i] = 255; out[i + 1] = 255; out[i + 2] = 232;
    }
  };
}

// FastLED Confetti：随机撒彩色点，整帧缓慢衰减
function initConfetti(G){
  return function(t, dt, out, p){
    fadeOut(out, fadeK(0.955, dt));
    const n = Math.max(1, Math.round(2.5 * p.scale));
    for (let j = 0; j < n; j++){
      const k = G.keys[(Math.random() * G.keys.length) | 0];
      const c = hsv(Math.random(), 1, 1);
      const i = k.li * 3;
      out[i] = c[0]; out[i + 1] = c[1]; out[i + 2] = c[2];
    }
  };
}

// FastLED Juggle：3 个小球沿灯序跳，屁股留拖尾
function initJuggle(G){
  const N = 3, keys = G.keys;
  const pos = new Float32Array(N), sp = new Float32Array(N);
  for (let i = 0; i < N; i++){ pos[i] = Math.random(); sp[i] = 0.30 + Math.random() * 0.35; }
  return function(t, dt, out, p){
    fadeOut(out, fadeK(0.90, dt));
    for (let i = 0; i < N; i++){
      pos[i] += sp[i] * dt * p.speed;
      if (pos[i] >= 1){ pos[i] -= 1; sp[i] = 0.30 + Math.random() * 0.35; }
      const k = keys[Math.min(keys.length - 1, (pos[i] * keys.length) | 0)];
      const c = hsv(i / N + t * 0.05, 1, 1);
      const li = k.li * 3;
      out[li] = c[0]; out[li + 1] = c[1]; out[li + 2] = c[2];
    }
  };
}

// FastLED BPM：整片同色，跟着节拍呼吸
function initBPM(G){
  return function(t, dt, out, p){
    const b = Math.pow(Math.sin(t * Math.PI * 1.15) * 0.5 + 0.5, 3.2);
    const c = hsv(t * 0.06, 1, 0.08 + b * 0.92);
    for (const k of G.keys){
      const i = k.li * 3;
      out[i] = c[0]; out[i + 1] = c[1]; out[i + 2] = c[2];
    }
  };
}

// FastLED Pacifica：深蓝到青色的多层涌浪
function initPacifica(G){
  const ph = [Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28];
  return function(t, dt, out, p){
    const s = 1.6 * p.scale;
    for (const k of G.keys){
      const x = k.nx, y = k.ny;
      let v = Math.sin(x * 2.2 * s + t * 0.11 + ph[0])
            + Math.sin(x * 3.1 * s - y * 1.7 * s + t * 0.15 + ph[1])
            + Math.sin(y * 2.6 * s + x * 1.1 * s - t * 0.09 + ph[2]);
      v = clamp(v / 3 * 0.5 + 0.5, 0, 1);
      v = Math.pow(v, 1.9);
      let c;
      if (v < 0.55){
        const q = v / 0.55;
        c = [6 + q * 30, 26 + q * 110, 70 + q * 130];
      } else {
        const q = (v - 0.55) / 0.45;
        c = [36 + q * 170, 136 + q * 110, 200 + q * 55];
      }
      const i = k.li * 3;
      out[i] = c[0]; out[i + 1] = c[1]; out[i + 2] = c[2];
    }
  };
}

// FastLED ColorWaves：色相与亮度各自一波，叠加着流动
function initColorWaves(G){
  return function(t, dt, out, p){
    const s = 1.9 / Math.max(0.35, p.scale);
    for (const k of G.keys){
      const x = k.nx * s, y = k.ny * s;
      const hue = Math.sin(x * 1.7 + y * 0.9 + t * 0.36) * 0.5 + 0.5;
      const val = Math.sin(y * 1.5 - x * 0.7 - t * 0.29) * 0.5 + 0.5;
      const c = hsv(0.42 + hue * 0.42, 0.95, 0.18 + val * 0.82);
      const i = k.li * 3;
      out[i] = c[0]; out[i + 1] = c[1]; out[i + 2] = c[2];
    }
  };
}

// FastLED inoise8 / WLED 云雾：fbm 噪声平移，慢速流动
function initClouds(G){
  return function(t, dt, out, p){
    const s = 2.2 * p.scale;
    const dx = t * 0.13, dy = -t * 0.09;
    for (const k of G.keys){
      const n = fbm2(k.nx * s + dx, k.ny * s * 1.6 + dy);
      const v = clamp((n - 0.28) * 2.0, 0, 1);
      const c = hsv(0.60 - v * 0.13, 0.7 - v * 0.45, 0.06 + v * 0.94);
      const i = k.li * 3;
      out[i] = c[0]; out[i + 1] = c[1]; out[i + 2] = c[2];
    }
  };
}

// QMK KNIGHT：红色光点在整排来回扫，带拖尾
function initCylon(G){
  const cols = G.cols;
  return function(t, dt, out, p){
    fadeOut(out, fadeK(0.93, dt));
    const ph = (t * 0.42) % 2;
    const f = ph < 1 ? ph : 2 - ph;
    const cpos = f * (cols - 1);
    for (const k of G.keys){
      const d = Math.abs(k.c - cpos);
      if (d > 1.25) continue;
      const v = 1 - d / 1.25;
      const li = k.li * 3;
      const r = 255 * v, g = 24 * v, b = 8 * v;
      if (r > out[li]) out[li] = r;
      if (g > out[li + 1]) out[li + 1] = g;
      if (b > out[li + 2]) out[li + 2] = b;
    }
  };
}

// QMK TWINKLE：黑底，随机亮起的星星慢慢熄灭
function initTwinkle(G){
  const keys = G.keys;
  const lv = new Float32Array(keys.length);
  return function(t, dt, out, p){
    out.fill(0);
    const k = fadeK(0.982, dt);
    for (let i = 0; i < lv.length; i++) lv[i] *= k;
    const rate = 0.09 * p.scale;
    for (let j = 0; j < 4; j++){
      if (Math.random() < rate) lv[(Math.random() * keys.length) | 0] = 0.6 + Math.random() * 0.4;
    }
    for (let i = 0; i < keys.length; i++){
      const v = lv[i];
      if (v < 0.03) continue;
      const c = hsv(0.56 + v * 0.16, 0.3, v);
      const li = keys[i].li * 3;
      out[li] = c[0]; out[li + 1] = c[1]; out[li + 2] = c[2];
    }
  };
}

// QMK FIREWORKS：随机位置炸开粒子，带重力
function initFireworks(G){
  const keys = G.keys, parts = [];
  let acc = 0.5;
  return function(t, dt, out, p){
    fadeOut(out, fadeK(0.90, dt));
    acc += dt * p.speed;
    if (acc > 0.5){
      acc = 0;
      const cx = 0.12 + Math.random() * 0.76, cy = 0.15 + Math.random() * 0.7;
      const hue = Math.random();
      const n = 14 + ((Math.random() * 10) | 0);
      for (let i = 0; i < n; i++){
        const a = Math.random() * Math.PI * 2, sp = 0.22 + Math.random() * 0.4;
        parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, hue: hue });
      }
    }
    for (let i = parts.length - 1; i >= 0; i--){
      const q = parts[i];
      q.x += q.vx * dt; q.y += q.vy * dt;
      const drag = fadeK(0.985, dt);
      q.vx *= drag;
      q.vy = q.vy * drag + dt * 0.18;
      q.life -= dt * 1.05;
      if (q.life <= 0 || q.x < -0.15 || q.x > 1.15 || q.y < -0.15 || q.y > 1.15){
        parts.splice(i, 1); continue;
      }
      let best = -1, bd = 1e9;
      for (let j = 0; j < keys.length; j++){
        const kk = keys[j];
        const d = (kk.nx - q.x) * (kk.nx - q.x) + (kk.ny - q.y) * (kk.ny - q.y);
        if (d < bd){ bd = d; best = j; }
      }
      if (best < 0) continue;
      const c = hsv(q.hue + (1 - q.life) * 0.1, 1 - q.life * 0.45, q.life);
      const li = keys[best].li * 3;
      if (c[0] > out[li]) out[li] = c[0];
      if (c[1] > out[li + 1]) out[li + 1] = c[1];
      if (c[2] > out[li + 2]) out[li + 2] = c[2];
    }
    if (parts.length > 400) parts.splice(0, parts.length - 400);
  };
}

// QMK SNAKE：贪吃蛇在键阵上爬，自动朝食物走
function initSnake(G){
  const cols = G.cols, rows = G.rows;
  const cellLi = new Array(cols * rows).fill(-1);
  for (const k of G.keys) cellLi[k.r * cols + k.c] = k.li;
  const midR = (rows / 2) | 0;
  let body = [{ r: midR, c: 0 }, { r: midR, c: Math.min(cols - 1, 1) }, { r: midR, c: Math.min(cols - 1, 2) }];
  let food = { r: (rows / 2) | 0, c: (cols / 2) | 0 };
  let acc = 0;
  const pick = function(){
    for (let i = 0; i < 80; i++){
      const r = (Math.random() * rows) | 0, c = (Math.random() * cols) | 0;
      if (cellLi[r * cols + c] >= 0 && !body.some(function(s){ return s.r === r && s.c === c; })){
        food = { r: r, c: c }; return;
      }
    }
  };
  pick();
  return function(t, dt, out, p){
    out.fill(2);
    acc += dt * p.speed;
    const step = 0.13;
    let guard = 0;
    while (acc > step && guard++ < 8){
      acc -= step;
      const h = body[0];
      const dr = food.r - h.r, dc = food.c - h.c;
      const cand = [];
      if (Math.abs(dr) >= Math.abs(dc)){
        if (dr) cand.push({ r: dr > 0 ? 1 : -1, c: 0 });
        if (dc) cand.push({ r: 0, c: dc > 0 ? 1 : -1 });
      } else {
        if (dc) cand.push({ r: 0, c: dc > 0 ? 1 : -1 });
        if (dr) cand.push({ r: dr > 0 ? 1 : -1, c: 0 });
      }
      let mv = cand[0] || { r: 0, c: 1 }, fallback = mv;
      for (const d of cand){
        const nr = (h.r + d.r + rows) % rows, nc = (h.c + d.c + cols) % cols;
        const hit = body.some(function(s, idx){ return idx < body.length - 1 && s.r === nr && s.c === nc; });
        if (hit) continue;
        fallback = d;
        // 优先走有灯珠的格子，不然蛇会钻进键缝里看不见
        if (cellLi[nr * cols + nc] >= 0){ mv = d; break; }
      }
      if (cellLi[((h.r + mv.r + rows) % rows) * cols + ((h.c + mv.c + cols) % cols)] < 0) mv = fallback;
      const nr = (h.r + mv.r + rows) % rows, nc = (h.c + mv.c + cols) % cols;
      body.unshift({ r: nr, c: nc });
      if (nr === food.r && nc === food.c) pick(); else body.pop();
      if (body.length > cols * rows * 0.55) body = body.slice(0, 3);
    }
    for (let i = body.length - 1; i >= 0; i--){
      const s = body[i];
      const li = cellLi[s.r * cols + s.c];
      if (li < 0) continue;
      const f = 1 - i / Math.max(1, body.length);
      const c = i === 0 ? [200, 255, 235] : hsv(0.36 - f * 0.16, 0.95, 0.22 + f * 0.78);
      out[li * 3] = c[0]; out[li * 3 + 1] = c[1]; out[li * 3 + 2] = c[2];
    }
    const fli = cellLi[food.r * cols + food.c];
    if (fli >= 0){
      const pu = 0.55 + 0.45 * Math.sin(t * 9);
      out[fli * 3] = 255 * pu; out[fli * 3 + 1] = 46 * pu; out[fli * 3 + 2] = 40 * pu;
    }
  };
}

// WLED RIPPLE：随机落点，同心圆一圈圈荡开
function initAutoRipple(G){
  const rings = [];
  let acc = 0;
  return function(t, dt, out, p){
    out.fill(6);
    acc += dt * p.speed;
    if (acc > 0.45){
      acc = 0;
      rings.push({ x: 0.1 + Math.random() * 0.8, y: 0.1 + Math.random() * 0.8,
                   t0: t, hue: Math.random(), w: 0.10 + Math.random() * 0.07 });
    }
    for (let i = rings.length - 1; i >= 0; i--){
      const age = t - rings[i].t0;
      if (age > 2.4){ rings.splice(i, 1); continue; }
      const rad = age * 0.5, alp = 1 - age / 2.4, r0 = rings[i];
      for (const k of G.keys){
        const d = Math.hypot(k.nx - r0.x, k.ny - r0.y);
        const a = 1 - Math.abs(d - rad) / r0.w;
        if (a <= 0.02) continue;
        const c = hsv(r0.hue + age * 0.08, 0.9, a * alp);
        const li = k.li * 3;
        if (c[0] > out[li]) out[li] = c[0];
        if (c[1] > out[li + 1]) out[li + 1] = c[1];
        if (c[2] > out[li + 2]) out[li + 2] = c[2];
      }
    }
  };
}

// ===== 跑马灯 · 四圈螺旋（原创编排，不是移植） =====
// 光路怎么来的：把每颗键换算成「到中心的欧氏距离 rr」（0=正中，1=最外圈）和「顺时针角度 f」（0=正上方），
// 螺旋参数 s = j + f，其中圈号 j = round((1-rr)/Δ - f) 取整后夹到 ≥0，Δ=1/4 表示每转一圈半径收进 1/4。
// 含义：螺旋第 j 圈在角度 f 处的半径正好是 1-(j+f)Δ，所以"半径 rr、角度 f"的键就落在
// 满足 1-(j+f)Δ ≈ rr 的那一圈上。s 单调递增的排序天生是一条从外圈卷到中心的连续螺旋，
// 外圈那一整圈就是 s∈[0,1]，跑完正好接第二圈 s∈[1,2]……四圈跑完 s 覆盖到中心，整盘自然填满，路径没有跳点。
// （这里必须用 round 不能用 floor：外圈 rr≈1 时 (1-rr)/Δ=0，floor 会把半圈键全压成 s=0，顶行会整排瞬亮。）
// 演出分三段：① 光头顺时针扫，身后拖彗尾并逐圈点亮，每跑满一圈闪一次；
//             ② 满盘后彩虹缎带呼吸，一道白色斜光从左上扫到右下，再来一圈从中心荡开的涟漪；
//             ③ 光从头往回拆线（彩虹从中心往外抽掉），无缝接回 ①。
function initMarquee(G){
  const keys = G.keys;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const k of keys){
    if (k.nx < x0) x0 = k.nx; if (k.nx > x1) x1 = k.nx;
    if (k.ny < y0) y0 = k.ny; if (k.ny > y1) y1 = k.ny;
  }
  const bw = (x1 - x0) || 1, bh = (y1 - y0) || 1;
  const LAPS = 4, D = 1 / LAPS;
  const items = keys.map(function(k){
    const u = (k.nx - x0) / bw, v = (k.ny - y0) / bh;
    const rr = Math.hypot(u - 0.5, v - 0.5) * 2;                            // 0 中心 → 1 最外（欧氏距离）
    const f = (Math.atan2(v - 0.5, u - 0.5) / 6.283185 + 0.25 + 1) % 1;    // 0=正上方，顺时针递增
    const s = Math.max(0, Math.round((1 - rr) / D - f)) + f;               // 螺旋参数（圈号先夹到 ≥0 再加角位）
    return { li: k.li, u: u, v: v, rr: rr, s: s, g: 0, big: k.w > 0.15 };
  });
  let smax = 1e-6;
  for (const it of items) if (it.s > smax) smax = it.s;
  for (const it of items) it.g = it.s / smax;                              // 归一到 0..1

  const TF = 10.4, TH = 3.8, TD = 2.3, TC = TF + TH + TD;

  return function(t, dt, out, p){
    out.fill(0);
    const tt = ((t % TC) + TC) % TC;
    let h = 0, phase = 0, th = 0;
    if (tt < TF){ h = tt / TF; }
    else if (tt < TF + TH){ phase = 1; h = 1; th = tt - TF; }
    else { phase = 2; h = 1 - (tt - TF - TH) / TD; }

    // 每跑满一圈闪一次（四圈即四次，最后一次最亮，直接接上满盘的呼吸）
    let flash = 0;
    if (phase === 0){
      for (let k = 1; k <= 4; k++){
        const x = h - k * 0.25;
        if (x >= 0) flash += Math.exp(-x * x * 1400) * (k === 4 ? 2.4 : 1);
      }
    }
    const hueOff = t * 0.025;

    for (const it of items){
      let hue = it.rr * 0.82 + hueOff, s = 0.90, v = 0;   // 按半径取色 → 四圈 = 四道同心色环

      if (phase === 1){
        // 满盘：缎带呼吸 + 斜光扫过 + 中心涟漪
        const breath = 0.62 + 0.32 * Math.sin(th * 2.1 - 1.1);
        const sw = (th - 0.3) / 1.5;
        const pos = it.u * 0.62 + it.v * 0.38;
        const band = sw > -0.2 ? Math.exp(-Math.pow((pos - sw) * 7.5, 2)) : 0;
        const rad = Math.max(0, th - 2.05) * 0.55;
        const ring = th > 2.05 ? Math.exp(-Math.pow((it.rr - rad) * 6.5, 2)) * 0.55 : 0;
        v = breath + band * 0.9 + ring;
        s = 0.92 - band * 0.65 - ring * 0.5;

      } else if (phase === 2){
        // 彩虹被"拆线"：从中心往外抽掉
        const d2 = it.g - h;
        if (d2 > 0.05) continue;
        if (d2 > 0){
          const edge = 1 - d2 / 0.05;
          v = 0.95 * edge; s = 0.12;                       // 拆线处白热
        } else {
          v = 0.26 + 0.13 * (1 - it.rr); s = 0.94;         // 还没拆到的部分留着暗色
        }

      } else {
        const d = h - it.g;                                 // >0 已被光头扫过
        if (d < -0.02){
          // 还没扫到：极暗冷色底留住键盘轮廓；圈末闪光会连暗区一起提一下，四圈的分界就有"节拍"
          hue = 0.585 + it.g * 0.04; v = 0.036 + flash * 0.34; s = 0.75 - flash * 0.35;
        } else if (d < 0.012){
          v = 1.0; s = it.big ? 0.45 : 0.06;                // 光头正下方：白热点。宽键（空格 6 格）留一点色，免得整根发白像 UI 块
        } else {
          const tail = Math.exp(-d * 26);                   // 彗尾（衰减快一点，白斑才不会糊成一片）
          const base = 0.66 + 0.10 * (1 - it.rr) + 0.05 * Math.sin(it.g * 26 - t * 2.4);
          v = base + tail * 1.0 + flash * (0.30 + 0.5 * (1 - it.rr));
          s = 0.95 - (tail > 0.45 ? (tail - 0.45) * 1.8 : 0); // 只有光头附近两三颗才发白
        }
      }

      if (v > 1) v = 1; else if (v < 0) v = 0;
      if (s > 1) s = 1; else if (s < 0) s = 0;
      const c = hsv(hue, s, v);
      out[it.li * 3] = c[0]; out[it.li * 3 + 1] = c[1]; out[it.li * 3 + 2] = c[2];
    }
  };
}

function fillLayoutSelect(){
  const sel = $('selLayout');
  if (!sel) return;
  const keep = sel.value;
  // 保留第一项「选择机型布局」；离线测试的假 DOM 没有 options，跳过即可
  if (sel.options && typeof sel.remove === 'function'){
    while (sel.options.length > 1) sel.remove(1);
  }
  const names = Object.keys(LAYOUTS);
  for (const n of names){
    const o = document.createElement('option');
    o.value = n; o.textContent = n + ' · ' + LAYOUTS[n].leds + L(' 灯', ' LEDs');
    sel.appendChild(o);
  }
  sel.value = keep || S.layoutKey || '';
}

function fillFxList(){
  const box = $('fxList');
  if (!box) return;
  box.innerHTML = '';
  EFFECTS.forEach(function(fx, i){
    const b = document.createElement('button');
    b.innerHTML = '<b>' + fxName(fx) + '</b><i>' + fx.src + '</i>';
    if (i === S.fxIdx) b.classList.add('on');
    b.onclick = function(){ startFx(i); };
    box.appendChild(b);
  });
}

// 切换界面语言：静态文案读 data-zh / data-en，其余按当前 LANG 重画
function applyLang(){
  const zh = LANG !== 'en';
  document.documentElement.lang = zh ? 'zh-CN' : 'en';
  document.title = zh ? 'PMO Keyboard Lighting Playground · 24 个效果直推键盘'
                      : 'PMO Keyboard Lighting Playground · 24 live effects';
  const each = function(sel, fn){
    if (typeof document.querySelectorAll !== 'function') return;
    document.querySelectorAll(sel).forEach(fn);
  };
  each('[data-zh]', function(el){
    const v = el.getAttribute('data-' + LANG);
    if (v !== null) el.textContent = v;
  });
  each('[data-zh-title]', function(el){
    const v = el.getAttribute('data-' + LANG + '-title');
    if (v) el.title = v;
  });
  const sub = $('sub'); if (sub) sub.innerHTML = SUB[LANG];
  const tip = $('tip'); if (tip) tip.innerHTML = TIP[LANG];
  const lb = $('btnLang');
  if (lb){ lb.textContent = zh ? 'EN' : '中文'; lb.title = zh ? 'Switch to English' : '切换到中文'; }
  fillFxList();
  fillLayoutSelect();
  if (S.G){
    $('sLayout').textContent = S.layoutKey + ' · ' + S.G.leds + L(' 灯', ' LEDs');
    $('sFx').textContent = fxName(EFFECTS[S.fxIdx]);
  }
  if (S.lastStatus) setStatus(S.lastStatus[0], S.lastStatus[1], S.lastStatus[2]);
}

function setLang(lang){
  LANG = (lang === 'en') ? 'en' : 'zh';
  applyLang();
  try { localStorage.setItem('pmo.lang', LANG); } catch (e){}
}

// 从 HID 描述符精确算输出报文长度：长度不符时 Chrome 会直接拒发
function reportInfo(device){
  let best = null;
  for (const c of (device.collections || [])){
    for (const r of (c.outputReports || [])){
      const bytes = Math.ceil(((r.reportSize || 0) * (r.reportCount || 0)) / 8);
      if (!best || bytes > best.bytes) best = { reportId: r.reportId || 0, bytes };
    }
  }
  return best || { reportId: 0, bytes: 64 };
}

function applyReport(device){
  const oi = reportInfo(device);
  S.reportId = oi.reportId;
  // 实测 WAVE75 的 MI_01：OutputReportByteLength = 65（含 1 字节 reportId）。
  // WebHID 的 sendReport(reportId, data) 中 data 不含 reportId，所以 payload 只能是 64。
  // 描述符算出来的 65 必须减 1，否则 sendReport 会因长度不符直接抛错。
  let bytes = oi.bytes;
  if (bytes === 65) bytes = 64;
  S.bufLen = bytes >= 32 ? bytes : 64;
  S.chunk = 56;   // 64 - 8（0xAA/cmd/off×2/len/保留2/status 共占 8 字节）
  diag('ok', '报文：reportId=' + S.reportId + '  payload=' + S.bufLen + 'B  '
    + '数据区=' + S.chunk + 'B（描述符输出 ' + oi.bytes + 'B）',
    'report: reportId=' + S.reportId + '  payload=' + S.bufLen + 'B  '
    + 'data area=' + S.chunk + 'B (descriptor output ' + oi.bytes + 'B)');
}

// 接口结构 dump：探测失败时把描述符打到日志，便于判断是不是选错了口
function dumpDevice(device){
  const c = device.collections || [];
  diag('warn', '接口结构 ' + (device.productName || '?') + ' pid=0x'
    + (device.productId || 0).toString(16) + '：' + c.length + ' 个 collection',
    'interface layout ' + (device.productName || '?') + ' pid=0x'
    + (device.productId || 0).toString(16) + ': ' + c.length + ' collections');
  c.forEach(function(col, ci){
    const outs = (col.outputReports || []).map(function(r){
      return 'id' + (r.reportId || 0) + ':' + (r.reportSize || 0) + 'b×' + (r.reportCount || 0);
    }).join(',') || '无';
    const ins = (col.inputReports || []).map(function(r){
      return 'id' + (r.reportId || 0) + ':' + (r.reportSize || 0) + 'b×' + (r.reportCount || 0);
    }).join(',') || '无';
    diag('warn', '  #' + ci + ' usagePage=0x' + (col.usagePage || 0).toString(16)
      + ' usage=0x' + (col.usage || 0).toString(16) + ' | OUT ' + outs + ' | IN ' + ins,
      '  #' + ci + ' usagePage=0x' + (col.usagePage || 0).toString(16)
      + ' usage=0x' + (col.usage || 0).toString(16) + ' | OUT ' + outs + ' | IN ' + ins);
  });
}

// 探测单个接口：能否 open、发 START 后能否收到 0xAA 回包
async function probe(device){
  const tag = (device.productName || '?') + ' pid=0x' + (device.productId || 0).toString(16);
  if (!device.opened){
    try { await device.open(); }
    catch (e){ diag('warn', tag + ' · open 失败：' + e.message, tag + ' · open failed: ' + e.message); return false; }
  }
  S.dev = device;
  attachRx(device);
  applyReport(device);

  drain();
  try { await send(CMD.START, 0, 0); }
  catch (e){ diag('warn', tag + ' · sendReport 失败：' + e.message, tag + ' · sendReport failed: ' + e.message); return false; }

  await sleep(100);
  drain();
  try {
    await send(CMD.GET_DEVINFO, 0, Math.min(S.chunk, 32));
    const r = await waitInput(700);
    if (r[0] === MAGIC || r[1] === MAGIC){
      diag('ok', tag + ' · 应答正常', tag + ' · replies normally');
      return true;
    }
    diag('warn', tag + ' · 回包不含 0xAA：' + hexOf(r, 20), tag + ' · reply has no 0xAA: ' + hexOf(r, 20));
    return false;
  } catch (e){
    diag('warn', tag + ' · 无回包（大概不是厂商自定义那个接口）',
      tag + ' · no reply (probably not the vendor-defined interface)');
    dumpDevice(device);
    return false;
  }
}

async function connect(){
  if (!navigator.hid){
    alert('这个浏览器没有 WebHID。请用 Chrome / Edge，且页面必须跑在 https 或 localhost（file:// 也算安全上下文但部分版本会拦）。');
    return;
  }
  $('btnConnect').disabled = true;
  try {
    // 只按厂商号过滤：机械键盘会暴露 2~3 个 HID 接口，只有其中一个是厂商自定义口，
    // 精确 PID 过滤挡不住这个差别，只能拿到全部再逐个试
    const filters = [
      { vendorId: 14000 }, { vendorId: 12815 }, { vendorId: 7334 }, { vendorId: 7333 },
      // 兜底：厂商自定义 usagePage。即使键盘 VID 不在已知表里也能被列出来
      { usagePage: 0xFF00 }, { usagePage: 0xFF60 }, { usagePage: 0xFF00, usage: 0x01 },
      { usagePage: 0xFF00, usage: 0x02 }, { usagePage: 0xFF00, usage: 0x03 }
    ];
    let list = await navigator.hid.requestDevice({ filters: filters });
    if (!list.length){
      diag('warn', '弹窗里没选设备，尝试已授权列表', 'nothing picked in the dialog, trying the already-authorized list');
      list = await navigator.hid.getDevices();
    }
    if (!list.length){
      setStatus('没有拿到任何设备。请在弹窗里勾选键盘（可能要勾选多个同名条目）', '#d98d85',
        'No device selected. Pick the keyboard in the dialog (you may need to tick several same-named entries).');
      return;
    }
    diag('ok', '拿到 ' + list.length + ' 个接口，开始逐个探测',
      'got ' + list.length + ' interfaces, probing them one by one');

    let picked = null;
    for (const d of list){
      if (await probe(d)){ picked = d; break; }
      detachRx(d);
      try { d.close(); } catch (e){}
      if (S.dev === d) S.dev = null;
    }

    if (!picked){
      setStatus('所有接口都没回应。请在弹窗中把同名条目全部勾选，或先关掉 PMOHub 网页/客户端后重试', '#d98d85',
        'None of the interfaces answered. Tick every same-named entry in the dialog, or close the PMOHub page/app and retry.');
      diag('er', '探测失败：没有任何接口回 0xAA', 'probe failed: no interface answered with 0xAA');
      return;
    }

    S.dev = picked;
    const meta = DEVICES.find(x => x[1] === picked.productId);
    const name = meta ? meta[2] : (picked.productName || 'RDR 设备');
    // 不自动切换布局：PID 表会把同配列的机型混在一起（0x302B 标成 PMO P75，实物可能是 WAVE75），
    // 自动切会让预览和你眼前的键盘对不上、还找不到原因。只提示，切不切由上面的下拉决定。
    if (meta && LAYOUTS[meta[3]] && S.layoutKey !== meta[3]){
      diag('warn', 'PID 0x' + (picked.productId || 0).toString(16) + ' 在机型表里对应「' + meta[2]
        + '」，但当前用的是 ' + S.layoutKey + ' 布局；要换请在上方机型下拉里选（不会自动切换）',
        'PID 0x' + (picked.productId || 0).toString(16) + ' maps to "' + meta[2]
        + '" in the model table, but the current layout is ' + S.layoutKey
        + '; switch it from the layout dropdown above (it is never auto-switched)');
    }

    $('btnStop').disabled = false;
    $('btnBase').disabled = false;
    $('btnMatrix').disabled = false;
    $('btnSlot').disabled = false;

    setStatus(name + ' 已连接，读取设备信息…', '#d9b45c', name + ' connected, reading device info…');
    const inf = await readDeviceInfo();
    if (inf){
      const zones = [L('主键区', 'main')];
      if (inf.showLogo) zones.push('logo');
      if (inf.showSide) zones.push(L('侧灯', 'side'));
      const layout = inf.protocolVer >= 2
        ? L('58B 长表（含 logo/side/matrix）', '58B long table (logo/side/matrix)')
        : L('41B 短表', '41B short table');
      setStatus(name + ' · 协议 v' + inf.protocolVer + ' · ' + layout
        + ' · ' + inf.lightSize + ' 灯 · 亮度上限 ' + inf.maxBright
        + ' · 速度上限 ' + inf.maxSpeed + ' · ' + zones.join('/'), '#7ec89a',
        name + ' · protocol v' + inf.protocolVer + ' · ' + layout
        + ' · ' + inf.lightSize + ' LEDs · max brightness ' + inf.maxBright
        + ' · max speed ' + inf.maxSpeed + ' · ' + zones.join('/'));
      $('sLeds').textContent = (S.G ? S.G.leds : inf.lightSize) + ' (固件' + inf.lightSize + ')';
      diag('ok', '设备信息：v' + inf.protocolVer + ' / ' + inf.lightSize + '灯 / 亮度' + inf.maxBright
        + ' / 速度' + inf.maxSpeed + ' / logo=' + inf.showLogo + ' side=' + inf.showSide,
        'device info: v' + inf.protocolVer + ' / ' + inf.lightSize + ' LEDs / brightness ' + inf.maxBright
        + ' / speed ' + inf.maxSpeed + ' / logo=' + inf.showLogo + ' side=' + inf.showSide);
    } else {
      setStatus(name + ' 已连接，但读不到设备信息——先点「开启灯光通道」直接试', '#d9b45c',
      name + ' connected, but device info is unreadable — just click "Enable live channel" and try');
    }

    navigator.hid.addEventListener('disconnect', function(e){
      if (e.device === picked){
        detachRx(picked);
        S.dev = null; S.armed = false; S.devInfo = null;
        try { picked.close(); } catch (er){}
        setStatus('设备已断开（预览继续）', '#d98d85', 'Device disconnected (preview continues)');
        $('btnStop').disabled = true; $('btnBase').disabled = true; $('btnMatrix').disabled = true;
        $('btnSlot').disabled = true;
      }
    });
  } catch (e){
    diag('er', '连接异常：' + e.message, 'connection error: ' + e.message);
    setStatus('连接失败：' + e.message, '#d98d85', 'Connection failed: ' + e.message);
  } finally {
    $('btnConnect').disabled = false;
  }
}

const CODE2NAME = {
  Escape:'Esc', Backquote:'~', Digit1:'1', Digit2:'2', Digit3:'3', Digit4:'4',
  Digit5:'5', Digit6:'6', Digit7:'7', Digit8:'8', Digit9:'9', Digit0:'0',
  Minus:'-', Equal:'+', Backspace:'Bksp', Tab:'Tab',
  KeyQ:'Q', KeyW:'W', KeyE:'E', KeyR:'R', KeyT:'T', KeyY:'Y', KeyU:'U', KeyI:'I',
  KeyO:'O', KeyP:'P', BracketLeft:'[', BracketRight:']', Backslash:'\\',
  CapsLock:'Caps', KeyA:'A', KeyS:'S', KeyD:'D', KeyF:'F', KeyG:'G', KeyH:'H',
  KeyJ:'J', KeyK:'K', KeyL:'L', Semicolon:';', Quote:"'", Enter:'Enter',
  KeyZ:'Z', KeyX:'X', KeyC:'C', KeyV:'V', KeyB:'B', KeyN:'N', KeyM:'M',
  Comma:'<', Period:'>', Slash:'?',
  ShiftLeft:'L-Shift', ShiftRight:'R-Shift', ControlLeft:'L-Ctrl',
  MetaLeft:'L-Win', AltLeft:'L-Alt', AltRight:'R-Alt', Space:'Space',
  ArrowUp:'\u2191', ArrowDown:'\u2193', ArrowLeft:'\u2190', ArrowRight:'\u2192'
};

// 键盘按键采集：把物理键翻译成灯号，记进 S.hits / S.heat。
// 「按键涟漪」移除后暂时没有效果消费它，保留是因为这两份数据就是以后做按键驱动类效果的基础，
// 而且成本只有一次 keydown 判断。
function keyHit(code){
  if (!S.G) return;
  const nm = CODE2NAME[code];
  const found = nm ? S.G.byName.get(nm) : null;
  const target = found || S.G.keys[Math.floor(Math.random() * S.G.keys.length)];
  if (!target) return;
  S.hits.push({ nx: target.nx, ny: target.ny, age: 0, hue: Math.random() });
  if (S.hits.length > 14) S.hits.shift();
  if (S.heat && target.li < S.heat.length){
    S.heat[target.li] = Math.min(1.4, S.heat[target.li] + 1.0);
  }
}

window.addEventListener('keydown', function(e){
  if (e.repeat) return;
  keyHit(e.code);
});

fillLayoutSelect();
setLayout('WAVE75');
startFx(0);
try { if (localStorage.getItem('pmo.lang') === 'en') LANG = 'en'; } catch (e){}
applyLang();
requestAnimationFrame(tick);
